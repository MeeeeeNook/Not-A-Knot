    <!-- High-Speed Pre-render Meta Tag Hydration for Crawlers (Google, Facebook, Zalo, Twitter, Bing) -->
    <script>
      (function() {
        try {
          var origin = window.location.origin || 'https://www.notaknot.id.vn';
          var hash = window.location.hash || '';
          var search = window.location.search || '';
          var params = new URLSearchParams(search);
          var productId = params.get('product') || (hash.match(/#product\/([^/?&]+)/) ? hash.match(/#product\/([^/?&]+)/)[1] : null);
          var collectionId = params.get('collection') || (hash.match(/#collection\/([^/?&]+)/) ? hash.match(/#collection\/([^/?&]+)/)[1] : null);

          function updateMeta(attr, key, val) {
            var el = document.querySelector('meta[' + attr + '="' + key + '"]');
            if (!el) {
              el = document.createElement('meta');
              el.setAttribute(attr, key);
              document.head.appendChild(el);
            }
            el.setAttribute('content', val);
          }

          function updateCanonical(url) {
            var el = document.querySelector('link[rel="canonical"]');
            if (!el) {
              el = document.createElement('link');
              el.setAttribute('rel', 'canonical');
              document.head.appendChild(el);
            }
            el.setAttribute('href', url);
          }

          if (productId) {
            var cleanId = decodeURIComponent(productId);
            var prodUrl = origin + '/#product/' + cleanId;
            updateCanonical(prodUrl);
            updateMeta('property', 'og:url', prodUrl);
            updateMeta('property', 'og:type', 'product');
            updateMeta('property', 'product:brand', 'NOT A KNOT');
            updateMeta('property', 'product:availability', 'in stock');
            updateMeta('property', 'product:condition', 'new');
            updateMeta('property', 'product:price:currency', 'VND');
          } else if (collectionId) {
            var cleanCol = decodeURIComponent(collectionId);
            var colUrl = origin + '/#collection/' + cleanCol;
            updateCanonical(colUrl);
            updateMeta('property', 'og:url', colUrl);
            updateMeta('property', 'og:type', 'website');
          }
        } catch (e) {}
      })();
    </script>
